<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Nhạc Của Tôi</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; background: #121212; color: #fff; }
        .song { background: #1e1e1e; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; align-items: center; gap: 15px; }
        .cover { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; background: #333; }
        .info { flex-grow: 1; }
        h3 { margin: 0 0 5px 0; font-size: 16px; color: #1db954; }
        p { margin: 0; color: #b3b3b3; font-size: 13px; }
        button { padding: 8px 15px; background: #1db954; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1ed760; }
        #player-container { position: sticky; bottom: 0; background: #282828; padding: 15px; border-radius: 8px; margin-top: 20px; display: none; box-shadow: 0 -4px 10px rgba(0,0,0,0.5); }
        audio { width: 100%; margin-top: 10px; outline: none; }
    </style>
</head>
<body>
    <h2>🎵 Kho Nhạc Của Tôi</h2>
    <div id="playlist">Đang tải danh sách nhạc...</div>

    <div id="player-container">
        <h3 id="now-playing-title">Tên bài hát</h3>
        <p id="now-playing-artist">Nghệ sĩ</p>
        <audio id="audio-player" controls></audio>
    </div>

    <script>
        fetch('playlist.json')
            .then(response => response.json())
            .then(data => {
                const playlistDiv = document.getElementById('playlist');
                playlistDiv.innerHTML = ''; 

                data.forEach(song => {
                    const songDiv = document.createElement('div');
                    songDiv.className = 'song';
                    
                    // Nếu không có cover, dùng ảnh mặc định
                    const coverSrc = song.cover ? song.cover : 'https://via.placeholder.com/60/333333/FFFFFF?text=Music';

                    songDiv.innerHTML = `
                        <img src="${coverSrc}" class="cover" alt="cover" onerror="this.src='https://via.placeholder.com/60/333333/FFFFFF?text=Music'">
                        <div class="info">
                            <h3>${song.name}</h3>
                            <p>${song.artist} • ${song.album}</p>
                        </div>
                        <button onclick="playSong('${song.audio}', '${song.name.replace(/'/g, "\\'")}', '${song.artist.replace(/'/g, "\\'")}')">Phát</button>
                    `;
                    playlistDiv.appendChild(songDiv);
                });
            })
            .catch(error => {
                document.getElementById('playlist').innerHTML = 'Lỗi tải dữ liệu. Hãy kiểm tra lại file playlist.json!';
            });

        function playSong(audioSrc, title, artist) {
            const playerContainer = document.getElementById('player-container');
            const audioPlayer = document.getElementById('audio-player');
            
            document.getElementById('now-playing-title').textContent = title;
            document.getElementById('now-playing-artist').textContent = artist;
            
            audioPlayer.src = audioSrc;
            playerContainer.style.display = 'block';
            audioPlayer.play();
        }
    </script>
</body>
</html>
